name: Build gts210ltexx Kernel (Universal5433)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Git Permissions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/KernelSU"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libcrypt-dev \
                                 device-tree-compiler libfdt-dev ccache

      - name: Setup Toolchain
        run: |
          git clone --depth=1 https://github.com/YumeMichi/linaro-arm-eabi-4.9 toolchain
          sudo cp -r toolchain/* /usr/local/
          sudo ldconfig

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-gts210ltexx-${{ github.ref }}
          restore-keys: |
            kernel-gts210ltexx-
          max-size: 5G
          verbose: true

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE="arm-eabi-"
          export CC="ccache arm-eabi-gcc"
          export HOSTCC="ccache gcc"
          export HOSTCXX="ccache g++"

          # ccache configuration
          ccache --set-config=base_dir=${{ github.workspace }}
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=file_macro,time_macros,include_file_mtime,locale,pch_defines

          export KBUILD_BUILD_TIMESTAMP="2026-04-17"
          export KBUILD_BUILD_USER="android-gts210ltexx"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          make lineage_gts210ltexx_defconfig

          # Build
          make -j$(nproc) zImage Image dtbs

          echo "=== ccache Statistics ==="
          ccache -s

      - name: Filter DTBs
        run: |
          mkdir -p filtered_dtbs
          cp arch/arm/boot/dts/exynos5433-gts210_*.dtb filtered_dtbs/ 2>/dev/null || true

          cp arch/arm/boot/zImage zImage
          cp arch/arm/boot/Image Image

      - name: Build dt.img
        run: |
          git clone https://github.com/dsankouski/dtbtool-exynos.git dtbtool_src
          cd dtbtool_src
          gcc -O2 -Wall dtbtool-exynos.c -o dtbTool-exynos -lfdt
          ./dtbTool-exynos -o ../dt.img ../filtered_dtbs/*.dtb
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gts210ltexx-kernel-assets
          path: |
            zImage
            Image
            dt.img
