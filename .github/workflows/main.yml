name: Build gts210ltexx Kernel (Universal5433)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fix Git Permissions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git://"

      - name: Initialize Submodules Manually
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          git config --global --add safe.directory "$GITHUB_WORKSPACE/KernelSU"
      
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libcrypt-dev \
                                 device-tree-compiler libfdt-dev

      - name: Setup Toolchain
        run: |
          git clone --depth=1 https://github.com/JonasCardoso/Toolchain.git toolchain
          sudo cp -r toolchain/linaro_gcc/arm-eabi-7.5.0-2019.12/* /usr/local/
          sudo ldconfig

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-gts210ltexx-${{ github.ref }}
          restore-keys: |
            kernel-gts210ltexx-
          max-size: 5G
          verbose: true

      - name: Build Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE="arm-eabi-"

          make lineage_gts210ltexx_defconfig

          # Build
          make -j$(nproc) KCFLAGS="-Os -march=armv7ve -mtune=cortex-a57.cortex-a53 -fomit-frame-pointer" zImage Image dtbs

          echo "=== ccache Statistics ==="
          ccache -s

      - name: Filter DTBs
        run: |
          mkdir -p filtered_dtbs
          cp arch/arm/boot/dts/exynos5433-gts210_*.dtb filtered_dtbs/ 2>/dev/null || true

          cp arch/arm/boot/zImage zImage
          cp arch/arm/boot/Image Image

      - name: Build dt.img
        run: |
          git clone https://github.com/dsankouski/dtbtool-exynos.git dtbtool_src
          cd dtbtool_src
          gcc -O2 -Wall dtbtool-exynos.c -o dtbTool-exynos -lfdt
          ./dtbTool-exynos -o ../dt.img ../filtered_dtbs/*.dtb
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gts210ltexx-kernel-assets
          path: |
            zImage
            Image
            dt.img
