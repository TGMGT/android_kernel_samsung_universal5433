name: Build gts210ltexx Kernel (Universal5433)

on:
  workflow_dispatch: # Allows manual trigger from the "Actions" tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
            submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libcrypt-dev cmake device-tree-compiler libfdt-dev

      - name: Setup ARM32 Toolchain
        run: |
          # Clones the specific LineageOS GCC 4.9 toolchain for 32-bit ARM
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
           key: ${{ runner.os }}-ccache
           max-size: 1G

      - name: Build Kernel and DTBs
        run: |
          export ARCH=arm
          export CROSS_COMPILE="ccache arm-linux-androideabi-"
          export HOSTCC="ccache gcc"
          export HOSTCXX="ccache g++"
          
          # Load your specific device config
          make lineage_gts210ltexx_defconfig
          
          # Build the zImage and force the compilation of DTBs
          make -j$(nproc) zImage
          make -j$(nproc) dtbs

          ccache -s

      - name: Filter DTBs and Create zImage-dtb
        run: |
          # Step: Pick only LTE DTBs using the underscore to avoid wifi versions
          mkdir -p filtered_dtbs
          cp arch/arm/boot/dts/exynos5433-gts210_*.dtb filtered_dtbs/

          cp arch/arm/boot/zImage zImage
          
      - name: Build and Run dtbTool
        run: |
          ls -R $GITHUB_WORKSPACE/filtered_dtbs/
          # Download and compile the Exynos-specific dtbTool
          git clone https://github.com/dsankouski/dtbtool-exynos.git dtbtool_src
          cd dtbtool_src
          gcc -O2 -Wall dtbtool-exynos.c -o dtbTool-exynos -lfdt
          
          # Use the compiled tool to create dt.img from your filtered DTBs
          ./dtbTool-exynos -o $GITHUB_WORKSPACE/dt.img $GITHUB_WORKSPACE/filtered_dtbs/
          cd $GITHUB_WORKSPACE

      - name: Upload Build Results
        uses: actions/upload-artifact@v4
        with:
          name: gts210ltexx-kernel-assets
          path: |
            zImage
            dt.img
